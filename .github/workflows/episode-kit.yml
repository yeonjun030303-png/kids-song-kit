name: episode-kit

on:
  schedule:
    - cron: "0 19 * * 0,3"   # 월요일/목요일 새벽 04:00 (KST)
  workflow_dispatch:
    inputs:
      test:
        description: "true면 짧은 테스트(예시 가사)"
        default: "false"

permissions:
  contents: write

jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: ACE-Step 받기
        run: |
          git clone --depth 1 https://github.com/ACE-Step/ACE-Step-1.5.git ../ACE-Step-1.5
          cd ../ACE-Step-1.5 && uv sync
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ../ACE-Step-1.5/checkpoints
          key: ace-models-v1
      - name: 파이썬 패키지
        run: pip install -r requirements.txt
      - name: 에피소드 키트 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST: ${{ github.event.inputs.test }}
        run: python pipeline.py
      - name: 제목 기록 저장
        if: success()
        run: |
          git config user.name "kit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "update history" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: |
            out/*.zip
            out/ace_server.log
          retention-days: 7
